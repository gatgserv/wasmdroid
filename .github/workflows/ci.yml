name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked -p wasmdroid-engine -p wasmdroid-ffi
      - run: cargo clippy --locked -p wasmdroid-engine -p wasmdroid-ffi --all-targets -- -D warnings
      - shell: python
        run: |
          from pathlib import Path
          for path in Path('engine').rglob('Cargo.toml'):
              if 'drivers/wasmer-local' in path.as_posix():
                  continue
              import tomllib
              manifest = tomllib.loads(path.read_text())
              for section in ('dependencies', 'dev-dependencies', 'build-dependencies'):
                  assert not any(key.startswith('wasmer') for key in manifest.get(section, {})), path

  runtime-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo test --locked -p wasmdroid-wasmer-local

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: ./gradlew.bat :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug '-PwasmdroidAbis=arm64-v8a,x86_64' -PwasmdroidRuntime=true
        working-directory: android

# Device integration is a separate targeted local check (README).
# A successful APK build alone does not claim Android runtime execution.
