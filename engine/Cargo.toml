[package]
name = "wasmdroid-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
cap-std = "4.0"
cap-primitives = "4.0"
fs2 = "0.4"
tar = { version = "0.4", default-features = false }
flate2 = "1"
ring = "0.17"
libc = "0.2"
base64 = "0.22"
vt100 = { version = "=0.18.1", default-features = false }
saphyr-parser = { version = "=0.3.4", default-features = false }
shell-words = "=1.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "io-util"] }
