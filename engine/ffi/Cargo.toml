[package]
name = "wasmdroid-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
runtime = ["dep:wasmdroid-wasmer-local"]
wasmer = ["runtime", "wasmdroid-wasmer-local/cranelift"]
singlepass = ["runtime", "wasmdroid-wasmer-local/singlepass"]

[dependencies]
wasmdroid-engine = { path = ".." }
wasmdroid-wasmer-local = { path = "../drivers/wasmer-local", optional = true, default-features = false }
uniffi.workspace = true
serde_json.workspace = true
thiserror.workspace = true
