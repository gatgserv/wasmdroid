[package]
name = "wasmdroid-wasmer-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cranelift"]
cranelift = ["wasmer/cranelift"]
singlepass = ["wasmer/singlepass"]

[dependencies]
wasmer = { version = "=7.4.2", default-features = false, features = ["sys", "wat"] }
wasmer-wasix = { version = "=0.704.2", default-features = false, features = ["sys-minimal"] }
wasmer-types = "=7.4.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync", "macros"] }
anyhow = "1"
wasmdroid-engine = { path = "../.." }
wasmer-config = { version = "=0.704.2", default-features = false }
webc = "12"
async-trait = "0.1"
serde.workspace = true
url = "2.5"
wasmer-wasix-types = "=0.704.2"
virtual-net = { version = "=0.704.2", default-features = false, features = ["tokio"] }
